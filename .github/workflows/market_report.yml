name: Twice-daily market reports
on:
  schedule:
    # Wake early at KST 03-06 / 15-18, then wait for 06:00 / 18:00.
    - cron: "7,27,47 18-21,6-9 * * *"
  workflow_dispatch:
concurrency:
  group: market-report-delivery
  cancel-in-progress: false
permissions:
  contents: write
env:
  PYTHONUNBUFFERED: "1"
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 210
    steps:
      - name: Checkout latest code and delivery ledger
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Check pending slot
        id: gate
        run: python3 report_schedule.py gate
      - name: Setup Python
        if: steps.gate.outputs.proceed == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        if: steps.gate.outputs.proceed == 'true'
        run: pip install requests beautifulsoup4 anthropic
      - name: Wait and deliver report
        if: steps.gate.outputs.proceed == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python report_schedule.py run
