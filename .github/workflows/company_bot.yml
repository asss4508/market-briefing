name: 기업분석 봇 (즉시 감지)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"   # 매일 09:00 KST 자동 시작
    - cron: "0 7 * * *"   # 매일 16:00 KST 자동 시작

jobs:
  bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 360   # 최대 6시간

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 패키지 설치
        run: pip install telethon requests beautifulsoup4 anthropic

      - name: 기업분석 봇 실행
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_PAGES_URL: "https://asss4508.github.io/market-briefing"
        run: python company_bot.py
