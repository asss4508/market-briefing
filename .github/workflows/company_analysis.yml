name: 기업분석 리포트

on:
  workflow_dispatch:
    inputs:
      company:
        description: '기업명 (예: 삼양식품)'
        required: true
        type: string
  schedule:
    - cron: "*/5 22-23 * * 0,1,2,3,4"
    - cron: "*/5 0-14 * * 1,2,3,4,5"

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 기본 패키지 설치
        run: pip install requests

      # ── 수동 실행 (workflow_dispatch) ──────────────────────
      - name: 기업분석 실행 (수동)
        if: github.event_name == 'workflow_dispatch'
        run: pip install requests beautifulsoup4 anthropic

      - name: 리포트 생성 (수동)
        if: github.event_name == 'workflow_dispatch'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_PAGES_URL: "https://asss4508.github.io/market-briefing"
        run: python company_analysis.py "${{ github.event.inputs.company }}"

      # ── 자동 실행 (텔레그램 폴링) ─────────────────────────
      - name: 텔레그램 명령 감지 (자동)
        if: github.event_name == 'schedule'
        id: check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          OUTPUT=$(python telegram_listener.py --check-analysis)
          echo "$OUTPUT"
          COMPANY=$(echo "$OUTPUT" | grep "^COMPANY:" | sed 's/^COMPANY://')
          if [ -n "$COMPANY" ]; then
            echo "company=$COMPANY" >> $GITHUB_OUTPUT
          fi

      - name: 추가 패키지 설치 (자동)
        if: github.event_name == 'schedule' && steps.check.outputs.company != ''
        run: pip install beautifulsoup4 anthropic

      - name: 리포트 생성 (자동)
        if: github.event_name == 'schedule' && steps.check.outputs.company != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_PAGES_URL: "https://asss4508.github.io/market-briefing"
        run: python company_analysis.py "${{ steps.check.outputs.company }}"
